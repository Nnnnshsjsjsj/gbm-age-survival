<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cohortex</title>
<script>
(function () {
  // GitHub Pages serves this file for unknown paths. Send the visitor to the app root under the project path.
  var parts = location.pathname.split('/').filter(Boolean);
  var root = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : './';
  location.replace(root + (location.hash || ''));
})();
</script>
<meta http-equiv="refresh" content="0; url=./">
</head>
<body><p><a href="./">Go to cohortex</a></p></body>
</html>
